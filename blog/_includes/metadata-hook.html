<!-- Blog Bilingual Switcher & Preference Sync -->
<style>
  /* Blog Language Switcher Styles */
  #blog-lang-switcher {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 3px 8px;
    border-radius: 4px;
    font-family: var(--bs-font-monospace, monospace);
    font-size: 0.72rem;
    line-height: 1.2;
    transition: all 0.25s ease;
  }

  [data-mode="light"] #blog-lang-switcher {
    background: rgba(0, 0, 0, 0.04);
    border-color: rgba(0, 0, 0, 0.15);
  }

  #blog-lang-switcher:hover {
    border-color: rgba(0, 240, 255, 0.4);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
  }

  .blog-lang-btn {
    background: none;
    border: none;
    text-decoration: none !important;
    color: var(--text-muted-color, #888);
    padding: 1px 4px;
    cursor: pointer;
    font-weight: 500;
    font-family: inherit;
    font-size: inherit;
    transition: all 0.2s ease;
    line-height: 1;
    display: inline-block;
  }

  .blog-lang-btn:hover {
    color: #4da3ff;
    text-decoration: none !important;
  }

  .blog-lang-btn.active {
    color: #00f0ff;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
  }

  [data-mode="light"] .blog-lang-btn.active {
    color: #0070f3;
    text-shadow: none;
  }

  .blog-lang-sep {
    color: var(--text-muted-color, #666);
    opacity: 0.5;
    font-size: 0.65rem;
    user-select: none;
  }
</style>

<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function () {
    const isFrPage = window.location.pathname.indexOf('/blog/fr') !== -1;
    try {
      localStorage.setItem('site_lang', isFrPage ? 'fr' : 'en');
    } catch (e) {}

    const btnEn = document.getElementById('blog-btn-en');
    const btnFr = document.getElementById('blog-btn-fr');

    if (btnEn) {
      btnEn.addEventListener('click', function () {
        try {
          localStorage.setItem('site_lang', 'en');
        } catch (e) {}
      });
    }

    if (btnFr) {
      btnFr.addEventListener('click', function () {
        try {
          localStorage.setItem('site_lang', 'fr');
        } catch (e) {}
      });
    }
  });
</script>
